name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check gvisor-tap-vsock checksums
        run: ./update-checksums.sh --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-docker-action@v5
      - uses: actions/checkout@v7
      - name: Run tests
        run: ./tests/run.sh
