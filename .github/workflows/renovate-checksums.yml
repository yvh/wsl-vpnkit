name: Renovate checksums

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - Dockerfile
      - tests/docker/Dockerfile

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update gvisor-tap-vsock checksums
        run: ./update-checksums.sh
      - name: Commit and re-run CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- checksums; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update gvisor-tap-vsock checksums" -- checksums
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Pushes made with GITHUB_TOKEN do not trigger workflows
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
