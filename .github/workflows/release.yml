name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: wsl-vpnkit
  RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/setup-docker-action@v5
      - uses: actions/checkout@v7
      - name: Run tests
        run: ./tests/run.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - uses: actions/checkout@v7

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_NAME}:${GITHUB_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "archive=${IMAGE_NAME}-${VERSION}-amd64.wsl" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.version.outputs.tag }}
          build-args: |
            REF=${{ env.RUN_URL }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Package distribution
        run: |
          CONTAINER_ID="$(docker create --platform linux/amd64 "${{ steps.version.outputs.tag }}")"
          docker export "$CONTAINER_ID" | gzip > "${{ steps.version.outputs.archive }}"
          docker container rm "$CONTAINER_ID"

          sha256sum "${{ steps.version.outputs.archive }}" | tee "${{ steps.version.outputs.archive }}.sha256"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.version.outputs.archive }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.version.outputs.archive }}
            ${{ steps.version.outputs.archive }}.sha256
          generate_release_notes: true
